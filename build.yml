name: Build NL Creator Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Create Android app
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 maplibre-gl@4.7.1
          mkdir www
          cp ../index.html www/index.html
          cp node_modules/maplibre-gl/dist/maplibre-gl.js www/maplibre-gl.js
          cp node_modules/maplibre-gl/dist/maplibre-gl.css www/maplibre-gl.css
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js || true
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nl.creatorstudio",
            "appName": "NL Creator Studio",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Location and camera permission
        run: |
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          cat $M

      - name: App icon
        run: |
          RES=app/android/app/src/main/res
          mkdir -p $RES/drawable $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/values/nl_icon_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="nl_icon_bg">#15171C</color>
          </resources>
          EOF
          cat > $RES/drawable/nl_icon_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E5322D"
                android:pathData="M54,80 C54,80 34,62 34,46 A20,20 0 0 1 74,46 C74,62 54,80 54,80 Z"/>
            <path android:fillColor="#FFFFFF"
                android:pathData="M49,37 L49,55 L63,46 Z"/>
          </vector>
          EOF
          for f in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$f.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/nl_icon_bg"/>
            <foreground android:drawable="@drawable/nl_icon_fg"/>
          </adaptive-icon>
          EOF
          done

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../NL-Creator-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NL-Creator-Studio-APK
          path: NL-Creator-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NL-Creator-Studio-WEB
          path: index.html
